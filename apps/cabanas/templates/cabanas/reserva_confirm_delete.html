{% extends "base.html" %}
{% load static %}
{% block content %}
<h2>Eliminar Reserva</h2>
<p>¿Está seguro de desear eliminar la reserva <strong>{{ objeto.cabana.nombre }} - {{ objeto.cliente.rut }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'cabanas:reserva_list' %}">No, volver</a>
</form>
{% endblock %}

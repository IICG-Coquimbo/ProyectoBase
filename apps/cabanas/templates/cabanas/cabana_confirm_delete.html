{% extends "base.html" %}
{% load static %}
{% block content %}
<h2>Eliminar Cabana</h2>
<p>¿Está seguro de desear eliminar la cabana <strong>{{ objeto.nombre }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'cabanas:cabana_list' %}">No, volver</a>
</form>
{% endblock %}

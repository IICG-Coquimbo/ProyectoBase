{% extends "base.html" %}
{% load static %}
{% block content %}
<h2>{% if object.pk %}Editar{% else %}Crear{% endif %} Cabana</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if object.pk %}Actualizar{% else %}Guardar{% endif %}</button>
    <a href="{% url 'cabanas:cabana_list' %}">Cancelar</a>
</form>
{% endblock %}

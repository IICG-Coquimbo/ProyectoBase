{% extends "base.html" %}
{% load static %}
{% block content %}
<h2>{% if object.pk %}Editar{% else %}Crear{% endif %} Cliente</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if object.pk %}Actualizar{% else %}Guardar{% endif %}</button>
    <a href="{% url 'clientes:cliente_list' %}">Cancelar</a>
</form>
{% endblock %}
